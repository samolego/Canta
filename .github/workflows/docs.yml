name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      build_wasm:
        description: "Rebuild WASM app and include it in the deploy"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_wasm)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Restore cached WASM dist
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || !inputs.build_wasm)
        uses: actions/cache/restore@v4
        with:
          path: webApp/build/dist/wasmJs/productionExecutable
          key: wasm-app-${{ github.sha }}
          restore-keys: |
            wasm-app-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build full site (WASM + docs)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_wasm)
        run: |
          chmod +x gradlew
          cd docs
          npm install --no-audit --no-fund
          npm run site:build

      - name: Build docs (reuse cached WASM)
        if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || !inputs.build_wasm)
        run: |
          cd docs
          npm install --no-audit --no-fund
          npm run site:build:no-wasm

      - name: Save WASM dist to cache
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build_wasm)
        uses: actions/cache/save@v4
        with:
          path: webApp/build/dist/wasmJs/productionExecutable
          key: wasm-app-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
