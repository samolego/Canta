name: 🔍 Pull Request Check

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validateAndroid:
    name: 🤖 Validate Android Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: "21.x"
          cache: "gradle"
          distribution: "adopt"

      - name: 🔍 Run tests
        run: ./gradlew :packages:desktopTest :composeApp:desktopTest

      - name: 🏗️ Verify debug build
        run: ./gradlew :androidApp:assembleDebug :desktopApp:desktopJar :webApp:wasmJsBrowserDistribution

      - name: 📦 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
